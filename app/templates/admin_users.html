{% extends 'base.html' %}
{% block content %}
<h1>Manage Users</h1>

<table class="data-table">
  <thead>
    <tr>
      <th>Username</th>
      <th>Current Role</th>
      <th>Change Role</th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.role }}</td>
      <td>
        <form method="POST" action="{{ url_for('update_user_role', user_id=user.id) }}">
          <select name="role">
            <option value="viewer" {% if user.role == 'viewer' %}selected{% endif %}>Viewer</option>
            <option value="analyst" {% if user.role == 'analyst' %}selected{% endif %}>Analyst</option>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
          </select>
          <button type="submit">Update</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
